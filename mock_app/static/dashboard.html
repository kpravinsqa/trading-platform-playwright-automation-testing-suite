<!doctype html><html lang="en"><head><meta charset="utf-8"><title>InvestPro | Portfolio</title>
<link rel="stylesheet" href="styles.css"><script src="common.js"></script><script src="app.js"></script></head>
<body><main>
<h1 data-testid="page-title">Portfolio</h1>
<div class="grid">
  <div class="card"><div class="muted">Cash available</div><div class="kpi" data-testid="cash"></div></div>
  <div class="card"><div class="muted">Invested</div><div class="kpi" data-testid="invested"></div></div>
  <div class="card"><div class="muted">Total account value</div><div class="kpi" data-testid="total-value"></div></div>
</div>
<div class="card"><h2>Positions</h2>
<table data-testid="positions-table"><thead><tr><th>Symbol</th><th>Qty</th><th>Avg price</th><th>Last</th><th>Market value</th><th>Unrealised P&amp;L</th></tr></thead><tbody></tbody></table>
<p class="muted" data-testid="no-positions" hidden>You have no open positions.</p></div>
</main>
<script>
if (shell("dashboard")) (async () => {
  const { data } = await API.get("/api/account");
  $('[data-testid="cash"]').textContent = money(data.cash, data.currency);
  $('[data-testid="invested"]').textContent = money(data.invested, data.currency);
  $('[data-testid="total-value"]').textContent = money(data.total_value, data.currency);
  const tbody = $('[data-testid="positions-table"] tbody');
  data.positions.forEach(p => tbody.append(el("tr", { testid: "position-" + p.symbol },
    el("td", {}, p.symbol), el("td", { testid: "qty" }, String(p.quantity)), el("td", {}, p.avg_price.toFixed(2)),
    el("td", {}, p.last_price.toFixed(2)), el("td", {}, money(p.market_value, data.currency)),
    el("td", { testid: "pnl" }, money(p.unrealised_pnl, data.currency)))));
  $('[data-testid="no-positions"]').hidden = data.positions.length > 0;
})();
</script></body></html>
